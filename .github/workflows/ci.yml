name: Rust native mod
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check out pinned Horizon Mixins
        run: |
          git clone https://github.com/horizon-rust/horizon-mixins ../horizon-mixins
          git -C ../horizon-mixins checkout "$(python3 -c 'import json; print(json.load(open("compatibility.json"))["horizon_mixins_revision"])')"
          cargo fetch --locked --manifest-path ../horizon-mixins/Cargo.toml
      - name: Check out pinned Horizon source
        run: |
          git clone https://github.com/horizon-rust/horizon ../horizon
          git -C ../horizon checkout "$(python3 -c 'import json; print(json.load(open("compatibility.json"))["horizon_revision"])')"
          cargo fetch --locked --manifest-path ../horizon/Cargo.toml
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - name: Compile and test the real Horizon integration
        run: python3 tools/horizon.py test --horizon ../horizon
      - name: Package native mod
        run: python3 tools/package.py
      - name: Upload .hnmod bundle
        uses: actions/upload-artifact@v4
        with:
          name: ftb-ultimine-hnmod
          path: target/ftb_ultimine-0.1.0.hnmod
          if-no-files-found: error
